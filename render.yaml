services:
  # ─── GoMufi Backend (FastAPI) ──────────────────────────────────────────────
  - type: web
    name: gomufi-backend
    runtime: docker
    # Render, Dockerfile'ı backend/ klasöründen build eder
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Render.com $PORT env variable'ını otomatik inject eder (varsayılan 10000)
    # Dockerfile CMD içinde ${PORT:-10000} ile kullanılır

    # Sağlık kontrolü — Render bu endpoint'i kontrol eder
    healthCheckPath: /utils/health

    envVars:
      # ── Temel Güvenlik ──────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true          # Render otomatik güçlü bir secret üretir

      # ── Veritabanı ──────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false                  # Dashboard'dan elle girilecek (Supabase URL)

      # ── Frontend URL (Vercel) ───────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://go-mufi.vercel.app

      # ── Google OAuth ─────────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false                  # Dashboard'dan elle girilecek
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ── Gemini AI ────────────────────────────────────────────────────────────
      - key: MY_API_KEY
        sync: false

      # ── E-posta (şifre sıfırlama, duyuru, veli raporu, ödev hatırlatma) ──────
      # Resend'de alan adını doğrula; EMAIL_FROM o alan adından olmalı.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: GoMufi <bildirim@gomufi.com>

      # ── Token Süreleri ────────────────────────────────────────────────────────
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── Admin ─────────────────────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ── NOT: REDIS_URL tanımlı değil → WebSocket local mod (single-instance) ──
      # Eğer Redis eklemek istersen REDIS_URL buraya ekle
