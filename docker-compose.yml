services:
  backend:
    build: ./backend
    container_name: gomufi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
      - ./backend/static:/app/static
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:8000
      - REDIS_URL=redis://redis:6379/0
      - NODE_ENV=development
    command: npm run dev
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/utils/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/package.json

  frontend:
    build: ./frontend
    container_name: gomufi-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: "no"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/

  redis:
    image: redis:alpine
    container_name: gomufi-redis
    ports:
      - "6379:6379"
    restart: always
